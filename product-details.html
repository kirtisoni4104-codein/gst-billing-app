<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - GST Bill App</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                GST BILL APP
            </a>

        </div>

    </nav>


    <!-- Product Details -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Product Details
                        </h2>


                        <!-- Product -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Product
                            </label>

                           <input type="text"
       class="form-control"
       id="productName"
       readonly>
                        </div>


                        <!-- GST -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                GST Rate
                            </label>
<input type="text"
       class="form-control"
       id="productGST"
       readonly>

                            <small class="text-muted">
                                GST is automatically taken from the
                                predefined product.
                            </small>

                        </div>


                        <!-- Price -->
                        <div class="mb-3">

                            <label for="price"
                                   class="form-label">
                                Price
                            </label>

           <input type="number"
       class="form-control"
       id="price"
       min="0">
                        </div>


                        <!-- Quantity -->
                        <div class="mb-3">

                            <label for="quantity"
                                   class="form-label">
                                Quantity
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="quantity"
                                   value="1"
                                   min="1">

                        </div>


                        <!-- Discount Type -->
                        <div class="mb-3">

                            <label for="discountType"
                                   class="form-label">
                                Discount Type
                            </label>

                            <select class="form-select"
                                    id="discountType">

                                <option value="percentage">
                                    Percentage (%)
                                </option>

                                <option value="amount">
                                    Fixed Amount (₹)
                                </option>

                            </select>

                        </div>


                        <!-- Discount -->
                        <div class="mb-3">

                            <label for="discount"
                                   class="form-label">
                                Product Discount
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="discount"
                                   value="0"
                                   min="0">

                        </div>


                        <!-- Calculation Preview -->
     <div class="alert alert-light border">

    <p class="mb-2">
        <strong>Amount:</strong>
        ₹<span id="amount">0</span>
    </p>

    <p class="mb-2">
        <strong>Discount:</strong>
        ₹<span id="discountAmount">0</span>
    </p>

    <p class="mb-2">
        <strong>Taxable Amount:</strong>
        ₹<span id="taxableAmount">0</span>
    </p>

    <p class="mb-2">
        <strong>GST Amount:</strong>
        ₹<span id="gstAmount">0</span>
    </p>

    <p class="mb-0">
        <strong>Product Total:</strong>
        ₹<span id="productTotal">0</span>
    </p>

</div>

                        <!-- Add Button -->
                        <div class="d-grid mt-4">

                            <a href="current-bill.html"
                               class="btn btn-primary btn-lg">

                                Add to Current Bill

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
<script src="js/products.js"></script>
<script src="js/gst.js"></script>

<script>

    // Get product ID from URL

    const urlParams =
        new URLSearchParams(window.location.search);

    const productId =
        Number(urlParams.get("id"));


    // Find selected product

    const selectedProduct =
        products.find(function(product) {

            return product.id === productId;

        });


    // Check product

    if (selectedProduct) {

        document.getElementById("productName").value =
            selectedProduct.name;


        document.getElementById("productGST").value =
            selectedProduct.gst + "% (Automatic)";


        document.getElementById("price").value =
            selectedProduct.price;

    }


    // Calculate preview

    function updatePreview() {

        const price =
            Number(document.getElementById("price").value);


        const quantity =
            Number(document.getElementById("quantity").value);


        const discount =
            Number(document.getElementById("discount").value);


        const discountType =
            document.getElementById("discountType").value;


        if (!selectedProduct) {

            return;

        }


        const result =
            calculateProductBill(
                price,
                quantity,
                discount,
                discountType,
                selectedProduct.gst
            );


        document.getElementById("amount").textContent =
            result.amount.toFixed(2);


        document.getElementById("discountAmount").textContent =
            result.discount.toFixed(2);


        document.getElementById("taxableAmount").textContent =
            result.taxableAmount.toFixed(2);


        document.getElementById("gstAmount").textContent =
            result.gstAmount.toFixed(2);


        document.getElementById("productTotal").textContent =
            result.total.toFixed(2);

    }


    // Update when values change

    document.getElementById("price")
        .addEventListener("input", updatePreview);


    document.getElementById("quantity")
        .addEventListener("input", updatePreview);


    document.getElementById("discount")
        .addEventListener("input", updatePreview);


    document.getElementById("discountType")
        .addEventListener("change", updatePreview);


    // First calculation

    updatePreview();

</script>
</body>

</html>
