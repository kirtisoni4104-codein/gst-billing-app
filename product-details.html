<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details - GST Bill App</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                GST BILL APP
            </a>

        </div>

    </nav>


    <!-- Product Details -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Product Details
                        </h2>


                        <!-- Product -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Product
                            </label>

                            <input type="text"
                                   class="form-control"
                                   value="Laptop"
                                   readonly>

                        </div>


                        <!-- GST -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                GST Rate
                            </label>

                            <input type="text"
                                   class="form-control"
                                   value="18% (Automatic)"
                                   readonly>

                            <small class="text-muted">
                                GST is automatically taken from the
                                predefined product.
                            </small>

                        </div>


                        <!-- Price -->
                        <div class="mb-3">

                            <label for="price"
                                   class="form-label">
                                Price
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="price"
                                   value="50000"
                                   min="0">

                        </div>


                        <!-- Quantity -->
                        <div class="mb-3">

                            <label for="quantity"
                                   class="form-label">
                                Quantity
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="quantity"
                                   value="1"
                                   min="1">

                        </div>


                        <!-- Discount Type -->
                        <div class="mb-3">

                            <label for="discountType"
                                   class="form-label">
                                Discount Type
                            </label>

                            <select class="form-select"
                                    id="discountType">

                                <option value="percentage">
                                    Percentage (%)
                                </option>

                                <option value="amount">
                                    Fixed Amount (₹)
                                </option>

                            </select>

                        </div>


                        <!-- Discount -->
                        <div class="mb-3">

                            <label for="discount"
                                   class="form-label">
                                Product Discount
                            </label>

                            <input type="number"
                                   class="form-control"
                                   id="discount"
                                   value="0"
                                   min="0">

                        </div>


                        <!-- Calculation Preview -->
                        <div class="alert alert-light border">

                            <p class="mb-2">
                                <strong>Amount:</strong>
                                ₹50,000
                            </p>

                            <p class="mb-2">
                                <strong>Discount:</strong>
                                ₹0
                            </p>

                            <p class="mb-2">
                                <strong>Taxable Amount:</strong>
                                ₹50,000
                            </p>

                            <p class="mb-2">
                                <strong>GST Amount:</strong>
                                ₹9,000
                            </p>

                            <p class="mb-0">
                                <strong>Product Total:</strong>
                                ₹59,000
                            </p>

                        </div>


                        <!-- Add Button -->
                        <div class="d-grid mt-4">

                            <a href="current-bill.html"
                               class="btn btn-primary btn-lg">

                                Add to Current Bill

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
