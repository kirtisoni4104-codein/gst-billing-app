<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback - GST Bill App</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>


    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                GST BILL APP

            </a>

        </div>

    </nav>


    <!-- Feedback Section -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow-sm">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Feedback
                        </h2>


                        <!-- Name -->
                        <div class="mb-3">

                            <label for="name"
                                   class="form-label">

                                Name

                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="name"
                                   placeholder="Enter your name">

                        </div>


                        <!-- Email -->
                        <div class="mb-3">

                            <label for="email"
                                   class="form-label">

                                Email

                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   placeholder="Enter your email">

                        </div>


                        <!-- Rating -->
                        <div class="mb-3">

                            <label for="rating"
                                   class="form-label">

                                Rating

                            </label>

                            <select class="form-select"
                                    id="rating">

                                <option selected>
                                    Select Rating
                                </option>

                                <option value="5">
                                    ⭐⭐⭐⭐⭐ Excellent
                                </option>

                                <option value="4">
                                    ⭐⭐⭐⭐ Very Good
                                </option>

                                <option value="3">
                                    ⭐⭐⭐ Good
                                </option>

                                <option value="2">
                                    ⭐⭐ Average
                                </option>

                                <option value="1">
                                    ⭐ Poor
                                </option>

                            </select>

                        </div>


                        <!-- Feedback -->
                        <div class="mb-3">

                            <label for="feedback"
                                   class="form-label">

                                Your Feedback

                            </label>

                            <textarea class="form-control"
                                      id="feedback"
                                      rows="5"
                                      placeholder="Write your feedback here..."></textarea>

                        </div>


                        <!-- Submit -->
                        <div class="d-grid mt-4">

                            <button type="button"
                                    class="btn btn-primary">

                                Submit Feedback

                            </button>

                        </div>


                        <!-- Home -->
                        <div class="text-center mt-3">

                            <a href="index.html"
                               class="text-decoration-none">

                                Back to Home

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


</body>

</html>
