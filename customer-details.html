<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Details - GST Bill App</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                GST BILL APP
            </a>

        </div>

    </nav>


    <!-- Customer Details -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Customer Details
                        </h2>


                        <!-- GST Question -->
                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Does the business have a GST number?
                            </label>

                            <div>

                                <button type="button"
                                        class="btn btn-success me-2">
                                    Yes
                                </button>

                                <button type="button"
                                        class="btn btn-secondary">
                                    No
                                </button>

                            </div>

                        </div>


                        <!-- GST Number -->
                        <div class="mb-3">

                            <label for="gstNumber"
                                   class="form-label">
                                GST Number
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="gstNumber"
                                   placeholder="Enter GST number">

                        </div>


                        <!-- Customer Name -->
                        <div class="mb-3">

                            <label for="customerName"
                                   class="form-label">
                                Customer Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="customerName"
                                   placeholder="Enter customer name">

                        </div>


                        <!-- Mobile -->
                        <div class="mb-3">

                            <label for="mobile"
                                   class="form-label">
                                Mobile Number
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   id="mobile"
                                   placeholder="Enter mobile number">

                        </div>


                        <!-- Customer ID -->
                        <div class="mb-3">

                            <label for="customerId"
                                   class="form-label">
                                Customer ID
                                <span class="text-muted">
                                    (Optional)
                                </span>
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="customerId"
                                   placeholder="Enter customer ID">

                        </div>


                        <!-- Address -->
                        <div class="mb-3">

                            <label for="address"
                                   class="form-label">
                                Address
                            </label>

                            <textarea class="form-control"
                                      id="address"
                                      rows="3"
                                      placeholder="Enter customer address"></textarea>

                        </div>


                        <!-- Continue -->
                        <div class="text-center mt-4">

                            <a href="categories.html"
                               class="btn btn-primary">
                                Continue
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
